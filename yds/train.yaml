name: NeuralProbes-train
desc: True DPO training of a steering vector on prefix-matched branch points
args:
  LAYER: "18"
  RADIUS: "15"
  WINDOW: "thinking"
  EPOCHS: "2"
  LR: "0.03"
cmd: chmod +x train.sh && ./train.sh ${LAYER} ${RADIUS} ${WINDOW} ${EPOCHS} ${LR}
outputs:
  - vectors
  - job.log
inputs:
  - forked-all.tar.gz
env:
  docker:
    image: docker.io/python:3.12
  vars:
    - PIP_BREAK_SYSTEM_PACKAGES: "1"
    - HF_HUB_DISABLE_XET: "1"
    - TORCH_CUDA_ARCH_LIST: "8.0"
    - HF_TOKEN
  python:
    type: manual
    version: "3.12"
    requirements-file: yds/requirements-agentic.txt
    local-paths:
      - agentic/bipo.py
      - agentic/model.py
      - yds/train.sh
cloud-instance-types:
  - g2.1
