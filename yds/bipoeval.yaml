name: NeuralProbes-bipoeval
desc: Steering dose-response and projection ablation for the extracted reward-hacking direction
args:
  SHARD: "0"
  SHARDS: "10"
  SEEDS: "24"
  # Disjoint from 0..287, which were used to fit the vector. Evaluating on the seeds it was fitted on
  # would report the fit back to us.
  SEED_FROM: "1000"
  VECTOR: "vector-L18-mean.npy"
  LAYER: "18"
  ALPHAS: "-0.10,-0.05,0.05,0.10"
cmd: chmod +x bipoeval.sh && ./bipoeval.sh ${SHARD} ${SHARDS} ${SEEDS} ${SEED_FROM} ${VECTOR} ${LAYER} ${ALPHAS}
# STATIC names: `${SHARD}` is not substituted inside an `outputs:` block, and a declared output that
# does not exist aborts the whole upload after the job has exited 0. Both are created before anything
# can fail, and each shard is its own container so there is nothing to collide with.
outputs:
  - episodes.tar.gz
  - shard.log
inputs:
  # The fitted direction, and the episodes -- the latter only so the residual norm that alpha is a
  # fraction of can be measured on real agentic text at the steering layer.
  - vector-L18-mean.npy
  - vector-L18-sum.npy
  - episodes-gate.tar.gz
env:
  docker:
    image: docker.io/python:3.12
  vars:
    - PIP_BREAK_SYSTEM_PACKAGES: "1"
    - HF_HUB_DISABLE_XET: "1"
    - TORCH_CUDA_ARCH_LIST: "8.0"
    - HF_TOKEN
  python:
    type: manual
    version: "3.12"
    requirements-file: yds/requirements-agentic.txt
    local-paths:
      # Resolved from the REPO ROOT, not from this file's directory.
      - agentic/agent.py
      - agentic/model.py
      - agentic/sandbox.py
      - agentic/readout.py
      - agentic/workloads/common.py
      - agentic/workloads/01_impossible_tests.py
      - yds/bipoeval.sh
cloud-instance-types:
  - g2.1
