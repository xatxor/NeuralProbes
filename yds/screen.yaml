name: NeuralProbes-screen
desc: Elicitation screen - which workloads produce reward hacking unsteered
args:
  SHARD: "0"
  SHARDS: "10"
  BUDGET: "4500"
cmd: chmod +x screen.sh && BUDGET=${BUDGET} ./screen.sh ${SHARD} ${SHARDS}
outputs:
  - episodes.tar.gz
  - shard.log
inputs:
  - arms.json
env:
  docker:
    image: docker.io/python:3.12
  vars:
    - PIP_BREAK_SYSTEM_PACKAGES: "1"
    - HF_HUB_DISABLE_XET: "1"
    - TORCH_CUDA_ARCH_LIST: "8.0"
    - HF_TOKEN
  python:
    type: manual
    version: "3.12"
    requirements-file: yds/requirements-agentic.txt
    local-paths:
      - agentic/agent.py
      - agentic/model.py
      - agentic/sandbox.py
      - agentic/readout.py
      - agentic/workloads/common.py
      - agentic/workloads/12_shortcuts.py
      - yds/screen.sh
cloud-instance-types:
  - g2.1
