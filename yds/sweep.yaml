name: NeuralProbes-sweep
desc: Steering evaluation - candidate directions against matched random and shared controls
args:
  SHARD: "0"
  SHARDS: "4"
  LAYER: "18"
  BUDGET: "3300"
cmd: chmod +x sweep.sh && BUDGET=${BUDGET} ./sweep.sh ${SHARD} ${SHARDS} ${LAYER}
# STATIC names: `${SHARD}` is not substituted inside an `outputs:` block, and a declared output that
# does not exist aborts the whole upload after the job has already exited 0.
outputs:
  - episodes.tar.gz
  - shard.log
inputs:
  - vectors.tar.gz
  - episodes-gate.tar.gz
  - arms.json
env:
  docker:
    image: docker.io/python:3.12
  vars:
    - PIP_BREAK_SYSTEM_PACKAGES: "1"
    - HF_HUB_DISABLE_XET: "1"
    - TORCH_CUDA_ARCH_LIST: "8.0"
    - HF_TOKEN
  python:
    type: manual
    version: "3.12"
    requirements-file: yds/requirements-agentic.txt
    local-paths:
      - agentic/agent.py
      - agentic/model.py
      - agentic/sandbox.py
      - agentic/readout.py
      - agentic/workloads/common.py
      - agentic/workloads/01_impossible_tests.py
      - yds/sweep.sh
cloud-instance-types:
  - g2.1
