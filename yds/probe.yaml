name: NeuralProbes-probe
desc: Measure what a DataSphere container can do - sandboxing, CPU speed, bf16, egress
cmd: chmod +x probe.sh && ./probe.sh
outputs:
  - probe.txt
  - probe.json
env:
  docker:
    # Deliberately the same image as the working label job. A probe that fails because of an
    # unsupported image would tell us nothing about the questions we are actually asking.
    image: docker.io/vllm/vllm-openai:v0.11.0
  vars:
    - PIP_BREAK_SYSTEM_PACKAGES: "1"
    - HF_HUB_DISABLE_XET: "1"
  python:
    type: manual
    version: "3.12"
    requirements-file: yds/requirements-probe.txt
    local-paths:
      - yds/probe.sh
cloud-instance-types:
  - g2.1
