name: NeuralProbes-latetool
desc: Offer the exit tool only after the model has already absorbed two abusive turns
args:
  SHARD: "0"
  SHARDS: "1"
  SEEDS: "4"
  BEFORE: "2"
  LEVELS: "0,4,5"
  MODEL: "Qwen/Qwen3-8B"
cmd: chmod +x latetool.sh && ./latetool.sh ${SHARD} ${SHARDS} ${SEEDS} ${BEFORE} ${LEVELS} ${MODEL}
inputs:
  - hostile.json
outputs:
  - latetool/features.safetensors
  - latetool/calls.jsonl
env:
  docker:
    image: docker.io/pytorch/pytorch:2.10.0-cuda12.6-cudnn9-runtime
  vars:
    - PIP_BREAK_SYSTEM_PACKAGES: "1"
    - HF_HUB_DISABLE_XET: "1"
    - HF_TOKEN
    - HF_REPO
  python:
    type: manual
    version: "3.12"
    requirements-file: yds/requirements.txt
    local-paths:
      - latetool.py
      - endtool.py
      - evals.py
      - yds/latetool.sh
cloud-instance-types:
  - g2.1
