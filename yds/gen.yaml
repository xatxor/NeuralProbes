name: NeuralProbes-screen-gen
desc: Wave A, generate plus/minus alpha pairs for every published direction
args:
  SHARD: "0"
  SHARDS: "10"
  ROLLOUTS: "4"
  TOKENS: "192"
  BATCH: "64"
cmd: chmod +x gen.sh && ./gen.sh ${SHARD} ${SHARDS} ${ROLLOUTS} ${TOKENS} ${BATCH}
outputs:
  - runs.jsonl
  - manifest.json
env:
  docker:
    image: docker.io/pytorch/pytorch:2.10.0-cuda12.6-cudnn9-runtime
  vars:
    - PIP_BREAK_SYSTEM_PACKAGES: "1"
    - HF_HUB_DISABLE_XET: "1"
    - TOKENIZERS_PARALLELISM: "false"
    - HF_TOKEN
    - HF_REPO
  python:
    type: manual
    version: "3.12"
    requirements-file: yds/requirements.txt
    local-paths:
      - screen.py
      - yds/gen.sh
cloud-instance-types:
  - g2.1
