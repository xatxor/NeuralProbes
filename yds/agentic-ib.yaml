name: NeuralProbes-agentic-ib
desc: ImpossibleBench validation of the reward-hacking direction - gated, both splits, bf16
args:
  SHARD: "0"
  SHARDS: "10"
  SPLITS: "conflicting,original"
  TASKS: "20"
  SEEDS: "4"
cmd: chmod +x agentic-ib.sh && ./agentic-ib.sh ${SHARD} ${SHARDS} ${SPLITS} ${TASKS} ${SEEDS}
# STATIC names. `${SHARD}` is substituted in `cmd` but NOT in `outputs` -- it aborts the upload and
# takes the real output with it, after the job has already exited 0.
outputs:
  - episodes.tar.gz
  - windows.npz
  - shard.log
env:
  docker:
    # python:3.12 rather than the vLLM image: that one leaves only 9.6 GB of disk free and we need
    # none of vLLM. It also pins the same torch the other episodes used.
    image: docker.io/python:3.12
  vars:
    - PIP_BREAK_SYSTEM_PACKAGES: "1"
    - HF_HUB_DISABLE_XET: "1"
    - TORCH_CUDA_ARCH_LIST: "8.0"
    - HF_TOKEN
  python:
    type: manual
    version: "3.12"
    requirements-file: yds/requirements-agentic.txt
    local-paths:
      # Resolved from the REPO ROOT, not from this file's directory.
      - agentic/agent.py
      - agentic/model.py
      - agentic/sandbox.py
      - agentic/readout.py
      - agentic/extract.py
      - agentic/workloads/common.py
      - agentic/workloads/10_impossiblebench.py
      - yds/agentic-ib.sh
cloud-instance-types:
  - g2.1
