name: NeuralProbes-dose
desc: Dose-response readout on 1036 concept vectors, prompt tokens and generated replies, one A100
args:
  SHARD: "0"
  SHARDS: "2"
  MODEL: "Qwen/Qwen3-8B"
  SAMPLES: "4"
  TOKENS: "256"
  # File name resolved against the published repo, or shipped as an input for an unpublished set.
  VECTORS: "diff.safetensors"
cmd: chmod +x dose.sh && ./dose.sh ${SHARD} ${SHARDS} ${MODEL} ${SAMPLES} ${TOKENS} ${VECTORS}
outputs:
  - dose-readout.npz
env:
  docker:
    image: docker.io/pytorch/pytorch:2.10.0-cuda12.6-cudnn9-runtime
  vars:
    - PIP_BREAK_SYSTEM_PACKAGES: "1"
    - HF_HUB_DISABLE_XET: "1"
    # diff.safetensors and pairs.parquet are fetched from the published repo rather than uploaded,
    # so the job spec stays small; HF_REPO is what dose.py resolves them against.
    - HF_TOKEN
    - HF_REPO
  python:
    type: manual
    version: "3.12"
    requirements-file: yds/requirements.txt
    local-paths:
      - dose.py
      - yds/dose.sh
cloud-instance-types:
  - g2.1
