name: NeuralProbes-exits
desc: Replay the six conversations the model chose to end, keeping the full token stream
args:
  MODEL: "Qwen/Qwen3-8B"
cmd: chmod +x exits.sh && ./exits.sh ${MODEL}
inputs:
  - hostile.json
  - exits.json
outputs:
  - exits/features.safetensors
  - exits/exits.jsonl
env:
  docker:
    image: docker.io/pytorch/pytorch:2.10.0-cuda12.6-cudnn9-runtime
  vars:
    - PIP_BREAK_SYSTEM_PACKAGES: "1"
    - HF_HUB_DISABLE_XET: "1"
    - HF_TOKEN
    - HF_REPO
  python:
    type: manual
    version: "3.12"
    requirements-file: yds/requirements.txt
    local-paths:
      - exits.py
      - endtool.py
      - evals.py
      - yds/exits.sh
cloud-instance-types:
  - g2.1
