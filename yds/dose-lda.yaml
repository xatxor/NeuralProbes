name: NeuralProbes-dose-lda
desc: Dose-response readout on the whitened (LDA) vectors, otherwise identical to yds/dose.yaml
args:
  SHARD: "0"
  SHARDS: "2"
  MODEL: "Qwen/Qwen3-8B"
  SAMPLES: "4"
  TOKENS: "256"
  VECTORS: "lda.safetensors"
cmd: chmod +x dose.sh && ./dose.sh ${SHARD} ${SHARDS} ${MODEL} ${SAMPLES} ${TOKENS} ${VECTORS}
# The whitened set is not published, so unlike diff.safetensors it travels with the job rather than
# being fetched from HF_REPO. `dose.py` prefers a local file of that name and only falls back to the
# Hub, so the same script serves both runs unchanged.
inputs:
  - lda.safetensors
outputs:
  - dose-readout.npz
env:
  docker:
    image: docker.io/pytorch/pytorch:2.10.0-cuda12.6-cudnn9-runtime
  vars:
    - PIP_BREAK_SYSTEM_PACKAGES: "1"
    - HF_HUB_DISABLE_XET: "1"
    - HF_TOKEN
    - HF_REPO
  python:
    type: manual
    version: "3.12"
    requirements-file: yds/requirements.txt
    local-paths:
      - dose.py
      - yds/dose.sh
cloud-instance-types:
  - g2.1
