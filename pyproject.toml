[project]
name = "NeuralProbes"
version = "0.1.0"
description = "Behavioral concept vectors extracted from LLM residual streams"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["numpy>=1.24", "python-dotenv>=1.2.2"]

[dependency-groups]
vectors = [
    "accelerate>=1.0.0",
    "datasets>=5.0.0",
    "huggingface-hub>=0.30.0",
    "pyarrow>=22.0.0",
    "safetensors>=0.6.0",
    "torch>=2.10,<2.11",
    "transformers>=5.13.1",
]
dev = ["mypy>=2.2.0", "ruff>=0.15.21"]

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py312"
include = ["*.py"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true
skip-magic-trailing-comma = false

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E731"]

[tool.mypy]
python_version = "3.12"
platform = "linux"
ignore_missing_imports = true
disable_error_code = ["import-untyped", "unused-ignore"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
files = ["genstats.py", "genvectors.py"]
